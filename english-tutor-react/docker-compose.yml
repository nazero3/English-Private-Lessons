services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lessons}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lessons}
      POSTGRES_DB: ${POSTGRES_DB:-lessons}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-lessons}']
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-lessons}:${POSTGRES_PASSWORD:-lessons}@db:5432/${POSTGRES_DB:-lessons}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_EXPIRE_HOURS: ${JWT_EXPIRE_HOURS:-72}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      SEED_DEMO_USERS: ${SEED_DEMO_USERS:-true}
    depends_on:
      db:
        condition: service_healthy

  nginx:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_USE_FASTAPI: 'true'
        VITE_API_URL: ''
    restart: unless-stopped
    ports:
      - '${HTTP_PORT:-80}:80'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public/books:/usr/share/nginx/html/books:ro
    depends_on:
      - api

volumes:
  pgdata:
