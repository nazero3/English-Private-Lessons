server {
    listen 80;
    server_name _;
    client_max_body_size 20m;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /books/ {
        alias /usr/share/nginx/html/books/;
        add_header Cache-Control "public, max-age=604800";
    }

    location = /coursebooks/english-file-beginner.pdf {
        return 301 /books/english/english-file/beginner-student-book.pdf;
    }
    location = /coursebooks/english-file-intermediate.pdf {
        return 301 /books/english/english-file/intermediate-student-book.pdf;
    }
    location = /coursebooks/grade9-algebra.pdf {
        return 301 /books/math/grade-9/algebra-student-book.pdf;
    }
    location = /coursebooks/grade9-geometry.pdf {
        return 301 /books/math/grade-9/geometry-student-book.pdf;
    }
    location = /coursebooks/grade12-math-f1.pdf {
        return 301 /books/math/grade-12-baccalaureate/part-1-student-book.pdf;
    }
    location = /coursebooks/grade12-math-f2.pdf {
        return 301 /books/math/grade-12-baccalaureate/part-2-student-book.pdf;
    }
    location = /coursebooks/grade12-physics.pdf {
        return 301 /books/physics/grade-12-baccalaureate/student-book.pdf;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
