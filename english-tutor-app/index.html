<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>English Tutor App - Grades 9 & 12</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="app-header">
      <h1>English Tutor App</h1>
      <p>Visual lessons, exercises, and end-of-lesson quizzes</p>
    </header>

    <main class="layout">
      <aside class="sidebar">
        <label for="gradeSelect">Choose Grade</label>
        <select id="gradeSelect">
          <option value="9">Grade 9</option>
          <option value="12">Grade 12</option>
        </select>

        <h2>Units</h2>
        <div id="unitList" class="unit-list"></div>
      </aside>

      <section class="content">
        <article class="card">
          <h2 id="unitTitle">Select a unit</h2>
          <p id="unitTheme"></p>
          <p><strong>Grammar focus:</strong> <span id="unitGrammar"></span></p>
          <p><strong>Arabic support:</strong> <span id="unitArabic"></span></p>
        </article>

        <article class="card">
          <h3>Visual Explanation</h3>
          <div id="visualArea" class="visual-area"></div>
          <p id="explanationText"></p>
        </article>

        <article class="card">
          <h3>Practice Exercises</h3>
          <div id="exerciseArea"></div>
          <button id="checkExerciseBtn" class="btn">Check Exercises</button>
          <p id="exerciseFeedback" class="feedback"></p>
        </article>

        <article class="card">
          <h3>End of Lesson Quiz</h3>
          <div id="quizArea"></div>
          <button id="submitQuizBtn" class="btn">Submit Quiz</button>
          <p id="quizResult" class="feedback"></p>
        </article>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
